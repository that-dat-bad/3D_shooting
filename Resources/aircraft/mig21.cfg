# ========================================================
# Aircraft Configuration File (.cfg)
# ========================================================

[General]
name = M-21 faust
modelPath = Resources/models/m21.gltf
afterburnerConfigPath = assets/configs/afterburner_m21.json
environmentCoefficient = 0.184
specularIntensity = 0.848
shininess = 166.837

[Airframe]
emptyFrameMass = 5450          # 空虚重量 (kg)
maxInternalFuel = 2200         # 最大内蔵燃料 (kg)
baseDrag = 0.02                 # 基本空気抵抗係数
liftCoefficient = 0.053           # 迎え角0時の揚力係数
wingArea = 23                  # 翼面積 (m^2)
maxHealth = 100                 # 最大耐久値
centerOfGravityZ = 0           # 重心位置Z

# --- 揚力・失速特性 ---
criticalAoA = 0.5              # 臨界迎え角 (rad)
maxLiftCoefficient = 1.115        # 最大揚力係数 (CLmax)
stallLiftCoefficient = 0.3      # 失速後残留揚力係数

# --- 誘導抵抗・G制限 ---
aspectRatio = 2.1               # 翼アスペクト比
oswaldEfficiency = 0.75          # オズワルド効率
positiveGLimit = 8.5            # 最大許容 +G
negativeGLimit = -3           # 最大許容 -G

# --- フラップ特性 ---
flapLiftBonus = 0.5             # フラップ展開時CL増加量
flapDragBonus = 0.08            # フラップ展開時Cd増加量
flapMaxSpeed = 97              # フラップ制限速度 (m/s)
flapDeploySpeed = 2           # フラップ展開速度 (1/s)

# --- エアブレーキ特性 ---
airBrakeDragBonus = 0.15        # エアブレーキCd増加量
airBrakeDeploySpeed = 3      # エアブレーキ展開速度 (1/s)

[Engine]
mass = 1000                     # エンジン重量 (kg)
baseThrust = 40000             # 定格推力 (N)
normalThrottleLimit = 1       # 通常スロットル上限 (1.0)
wepThrottleLimit = 2          # WEPスロットル上限 (1.1)
physicalSpoolSpeed = 0.25        # スプール反応速度
baseFuelFlowRate = 1.06          # 燃料消費率 (kg/s)
altitudeThrottleFactor = 4e-05  # 高度推力低下係数

[Gunpod]
baseMass = 50                 # ガンポッド本体重量 (kg)
drag = 0.005                     # ガンポッド抵抗係数
ammoWeight = 0.1               # 弾丸1発の重量 (kg)
maxAmmo = 500                  # 最大搭載弾数
fireRate = 25                 # 発射レート (発/秒)
