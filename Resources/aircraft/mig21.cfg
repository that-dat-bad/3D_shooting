# ========================================================
# Aircraft Configuration File (.cfg)
# MiG-21 Fishbed Multi-Role Fighter
# ========================================================

[General]
name = MiG-21 Fishbed
modelPath = Resources/models/m21.gltf
environmentCoefficient = 0.0
specularIntensity = 1.0
shininess = 50.0

[Airframe]
emptyFrameMass = 3000.0          # 空虚重量 (kg)
maxInternalFuel = 800.0         # 最大内蔵燃料 (kg)
baseDrag = 0.02                 # 基本空気抵抗係数
liftCoefficient = 0.4           # 迎え角0時の揚力係数
wingArea = 40.0                  # 翼面積 (m^2)
maxHealth = 100.0                 # 最大耐久値
centerOfGravityZ = 0.0           # 重心位置Z

# --- 揚力・失速特性 ---
criticalAoA = 0.5              # 臨界迎え角 (rad, ≈28.6deg)
maxLiftCoefficient = 1.5        # 最大揚力係数 (CLmax)
stallLiftCoefficient = 0.3      # 失速後残留揚力係数

# --- 誘導抵抗・G制限 ---
aspectRatio = 6.0               # 翼アスペクト比
oswaldEfficiency = 0.8          # オズワルド効率
positiveGLimit = 9.0            # 最大許容 +G
negativeGLimit = -3.0           # 最大許容 -G

# --- フラップ特性 ---
flapLiftBonus = 0.5             # フラップ展開時CL増加量
flapDragBonus = 0.08            # フラップ展開時Cd増加量
flapMaxSpeed = 97.0              # フラップ制限速度 (m/s, ≈350km/h)
flapDeploySpeed = 2.0           # フラップ展開速度 (1/s)

# --- エアブレーキ特性 ---
airBrakeDragBonus = 0.15        # エアブレーキCd増加量
airBrakeDeploySpeed = 3.0      # エアブレーキ展開速度 (1/s)

[Engine]
mass = 500.0                     # エンジン重量 (kg)
baseThrust = 80000.0             # 定格推力 (N, 80kN)
normalThrottleLimit = 1.0       # 通常スロットル上限 (100%)
wepThrottleLimit = 1.1          # WEPスロットル上限 (110%)
physicalSpoolSpeed = 0.5        # スプール反応速度
baseFuelFlowRate = 2.0          # 燃料消費率 (kg/s)
altitudeThrottleFactor = 0.00004  # 高度推力低下係数

[Gunpod]
baseMass = 50.0                 # ガンポッド本体重量 (kg)
drag = 0.005                     # ガンポッド抵抗係数
ammoWeight = 0.1               # 弾丸1発の重量 (kg)
maxAmmo = 500                  # 最大搭載弾数
fireRate = 25.0                 # 発射レート (発/秒)
